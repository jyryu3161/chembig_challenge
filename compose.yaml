name: chembig
x-app: &app
  image: ${APP_IMAGE:-chembig:local}
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    DATA_ROOT: /data
    USE_X_ACCEL: '1'
  volumes:
    - ${DATA_DIR:-./var}:/data
    - static:/app/staticfiles
  restart: unless-stopped
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  web:
    <<: *app
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':'localhost','X-Forwarded-Proto':'https'}))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=1 --max-tasks-per-child=50
    stop_grace_period: 250s
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    env_file: .env
    volumes: [postgres:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes: [redis:/data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
      - ${DATA_DIR:-./var}/student:/data/student:ro
      - ${DATA_DIR:-./var}/submissions:/data/submissions:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    restart: unless-stopped
    depends_on: [web]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  certbot:
    image: certbot/certbot:v4.0.0
    profiles: [maintenance]
    volumes: [certs:/etc/letsencrypt, acme:/var/www/certbot]
volumes:
  postgres:
  redis:
  static:
  certs:
  acme:
