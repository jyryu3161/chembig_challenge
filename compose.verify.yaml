# Local integration overlay; never use on EC2. Compose 2.24.4+ required for !override.
services:
  web:
    env_file: !override [./artifacts/verify.env]
  worker:
    env_file: !override [./artifacts/verify.env]
  db:
    env_file: !override [./artifacts/verify.env]
  nginx:
    ports: !override ['127.0.0.1:18080:80']
    volumes: !override
      - ./deploy/nginx-verify.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
      - ${DATA_DIR}/student:/data/student:ro
      - ${DATA_DIR}/submissions:/data/submissions:ro
