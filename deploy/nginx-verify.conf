# Loopback-only HTTP test proxy. Production uses nginx-tls.conf.template.
server {
    listen 80;
    server_name localhost;
    client_max_body_size 32m;
    location /static/ { alias /static/; }
    location /_protected_student/ { internal; alias /data/student/; }
    location /_protected_submissions/ { internal; alias /data/submissions/; }
    location ~ ^/(originals|backups|media|data)/ { return 404; }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 125s;
    }
}
