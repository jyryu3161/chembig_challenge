name: chembig-verify
services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: chembig_test
      POSTGRES_USER: chembig_test
      POSTGRES_PASSWORD: local-test-only
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U chembig_test']
      interval: 2s
      retries: 20
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports: ['127.0.0.1:56379:6379']
