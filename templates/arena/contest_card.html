<article class="card"><div class="flex items-center justify-between"><span class="badge {% if contest.ended %}gray{% endif %}">{{ contest.phase }}</span><span class="text-xs muted">{{ contest.semester }}</span></div><h3><a href="{% url 'contest' contest.pk %}">{{ contest.title }}</a></h3><p>{{ contest.description|truncatechars:95 }}</p><div class="card-meta"><span>개인전</span><span>CSV 예측 제출</span><span>ADMET</span></div><div class="card-footer"><span class="muted">{{ contest.closes_at|date:'m.d H:i' }} 마감</span><a class="font-semibold" href="{% url 'contest' contest.pk %}">대회 살펴보기 &nbsp; ↗</a></div></article>
