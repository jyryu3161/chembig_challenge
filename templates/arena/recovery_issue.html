{% extends 'base.html' %}{% block content %}<div class="form-box panel"><h1>학생 계정 복구</h1><p class="intro">기존 수업 연락 수단으로 본인을 확인한 후 발급하세요. 코드는 이 화면에서 한 번만 표시됩니다.</p>{% if code %}<div class="note">30분 이내에 사용할 수 있는 일회용 코드입니다.</div><pre>{{ code }}</pre>{% endif %}<form method="post">{% csrf_token %}<label for="username">학생 로그인 ID</label><input id="username" name="username" required maxlength="150"><button class="btn mt-5">본인 확인 완료 · 코드 발급</button></form></div>{% endblock %}
